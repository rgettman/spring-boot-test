server.port=8080

# Lets @JsonIgnoreProperties(ignoreUnknown = false) work properly!
spring.jackson.deserialization.fail-on-unknown-properties=true

# DB Connection properties.  Password is read from an environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=demo
spring.datasource.password=${POSTGRES_DEMO_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Caching properties.  Set the cache provider to Redis and the time-to-live to 5 minutes.
spring.cache.type=redis
spring.cache.redis.time-to-live=5m

# Redis properties.  6379 is the default port for Redis.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring AI
# Anthropic
#spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
#spring.ai.anthropic.chat.options.model=claude-haiku-4-5
# Ollama
spring.ai.ollama.chat.enabled=true
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:14b